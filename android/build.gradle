// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
    // 本机无法访问 dl.google.com，阿里云镜像兜底（仅用于缺失的 Google 专属 artifact）
    maven { url 'https://maven.aliyun.com/repository/google' }
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    // 本机无法访问 dl.google.com，阿里云镜像兜底（仅用于缺失的 Google 专属 artifact）
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://www.jitpack.io' }
  }
}

subprojects {
  afterEvaluate { project ->
    if (project.hasProperty('android')) {
      project.android.compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
      }
    }
    // Force all Java compilation tasks to JVM 21 regardless of module settings
    project.tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach { task ->
      task.sourceCompatibility = '21'
      task.targetCompatibility = '21'
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
